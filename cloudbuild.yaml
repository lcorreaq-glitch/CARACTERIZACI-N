# =============================================================================
# Cloud Build — pipeline de CI/CD para IU Digital Analítica Académica
# =============================================================================
# Uso manual:
#   gcloud builds submit --config=cloudbuild.yaml
# Uso automatizado: conectar el repositorio a Cloud Build → trigger on push.
# =============================================================================

substitutions:
  _REGION: us-central1
  _REPO: iud-images
  _BACKEND_URL: https://api.analitica.iudigital.edu.co

steps:
  # ---------- Backend ----------
  - name: gcr.io/cloud-builders/docker
    id: backend-build
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:latest
      - ./backend

  - name: gcr.io/cloud-builders/docker
    id: backend-push
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend"]
    waitFor: [backend-build]

  # ---------- Frontend ----------
  - name: gcr.io/cloud-builders/docker
    id: frontend-build
    args:
      - build
      - --build-arg
      - REACT_APP_BACKEND_URL=${_BACKEND_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:latest
      - ./frontend

  - name: gcr.io/cloud-builders/docker
    id: frontend-push
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend"]
    waitFor: [frontend-build]

  # ---------- Deploy Cloud Run ----------
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - iud-backend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/backend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --service-account=iud-app-runtime@${PROJECT_ID}.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=1
      - --max-instances=10
    waitFor: [backend-push]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - iud-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/frontend:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --min-instances=1
    waitFor: [frontend-push]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s
